<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MQAMTECH | Website Under Maintenance</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:linear-gradient(135deg,#0f172a,#1e3a8a);
            color:#fff;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            text-align:center;
        }

        .container{
            max-width:700px;
            padding:40px;
        }

        h1{
            font-size:60px;
            margin-bottom:15px;
            color:#38bdf8;
        }

        h2{
            font-size:32px;
            margin-bottom:20px;
        }

        p{
            font-size:18px;
            color:#d1d5db;
            line-height:1.8;
        }

        .loader{
            width:70px;
            height:70px;
            border:6px solid rgba(255,255,255,.2);
            border-top:6px solid #38bdf8;
            border-radius:50%;
            margin:40px auto;
            animation:spin 1s linear infinite;
        }

        @keyframes spin{
            100%{
                transform:rotate(360deg);
            }
        }

        .footer{
            margin-top:40px;
            color:#94a3b8;
            font-size:15px;
        }

        .logo{
            font-size:28px;
            font-weight:bold;
            margin-bottom:30px;
            letter-spacing:3px;
        }
    </style>

</head>

<body>

<div class="container">

<div class="logo">
MQAMTECH
</div>

<div class="loader"></div>

<h1>Coming Soon</h1>

<h2>Our Website is Under Maintenance</h2>

<p>
We are currently working on our new website to provide you with better IT solutions and services.
</p>

<p style="margin-top:20px;">
Thank you for your patience.
</p>

<div class="footer">

© 2026 MQAMTECH <br><br>

IT Solutions | Networking | Cybersecurity | Web Development

</div>

</div>

</body>
</html>
